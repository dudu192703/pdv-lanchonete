<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comandas • Piscibar do João</title><link rel="stylesheet" href="/static/comandas.css?v=popup3"></head>
<body><header><h1>🍽 Comandas <small>Piscibar do João</small></h1><button id="logout">Sair</button></header>
<main><section id="loginPanel" class="panel"><h2>Acesso do garçom</h2><form id="loginForm"><input id="password" type="password" placeholder="Senha do garçom" required autocomplete="current-password"><button>Entrar</button></form></section>
<div id="workspace" hidden><section class="panel"><h2>Comandas abertas</h2><form id="newForm"><input id="customer" maxlength="120" placeholder="Nome do cliente" required><button>Criar comanda</button></form><div id="tabs"></div></section>
<section class="panel" id="detail" hidden><h2 id="heading"></h2><div class="section-title">✅ Enviados para a cozinha</div><div id="sent"></div><div class="section-title pending">⏳ Pendentes para enviar</div><div id="pending"></div><div id="total"></div><button id="send" class="primary">🖨 Enviar pendentes para cozinha</button><h3>Adicionar produtos</h3><input id="search" placeholder="Pesquisar produto"><div id="products"></div></section></div>
<p id="message" role="status"></p></main><script src="/static/comandas.js?v=popup3"></script></body></html>
